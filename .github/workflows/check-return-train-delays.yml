name: Check Return UK Train Delays (EUS-CRE - London Northwest Railway - Lundi 15h30-18h30)

on:
  schedule:
    # Vérifie les lundis entre 15h30 et 18h30 (toutes les 30 min - 7 requêtes/jour)
    - cron: '30 15 * * 1'
    - cron: '0 16 * * 1'
    - cron: '30 16 * * 1'
    - cron: '0 17 * * 1'
    - cron: '30 17 * * 1'
    - cron: '0 18 * * 1'
    - cron: '30 18 * * 1'
  workflow_dispatch:
    # Permet de lancer manuellement

jobs:
  check-return-delays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run return train delay check
        id: check-return-delays
        env:
          TRANSPORT_API_ID: ${{ secrets.TRANSPORT_API_ID }}
          TRANSPORT_API_KEY: ${{ secrets.TRANSPORT_API_KEY }}
          FROM_STATION: ${{ secrets.RETURN_FROM_STATION }}
          TO_STATION: ${{ secrets.RETURN_TO_STATION }}
          OPERATOR_FILTER: "London Northwest Railway"
          DEPARTURE_TIME: ""
        run: |
          export FROM_STATION=${{ secrets.RETURN_FROM_STATION }}
          export TO_STATION=${{ secrets.RETURN_TO_STATION }}
          python scripts/check_train_delays.py

      - name: Read return train status
        id: read-return-status
        run: |
          if [ -f train_status.txt ]; then
            echo "status=$(cat train_status.txt)" >> $GITHUB_OUTPUT
          else
            echo "status=No train status file found" >> $GITHUB_OUTPUT
          fi

      - name: Send Discord Notification (Return)
        if: always()
        uses: Ilshidur/action-discord@0.6.4
        with:
          args: "🚄 **UK Train Alert (EUS→CRE - Lundi)**\n\n${{ steps.read-return-status.outputs.status }}"
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
