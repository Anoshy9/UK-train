name: Check UK Train Delays (CRE-EUS - London Northwest Railway - Jeudis)

on:
  schedule:
    # Vérifie les jeudis entre 15h00 et 19h30 (toutes les 30 min - 10 requêtes/jour)
    - cron: '0 15 * * 4'
    - cron: '30 15 * * 4'
    - cron: '0 16 * * 4'
    - cron: '30 16 * * 4'
    - cron: '0 17 * * 4'
    - cron: '30 17 * * 4'
    - cron: '0 18 * * 4'
    - cron: '30 18 * * 4'
    - cron: '0 19 * * 4'
    - cron: '30 19 * * 4'
  workflow_dispatch:
    # Permet de lancer manuellement

jobs:
  check-delays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run train delay check
        id: check-delays
        env:
          TRANSPORT_API_ID: ${{ secrets.TRANSPORT_API_ID }}
          TRANSPORT_API_KEY: ${{ secrets.TRANSPORT_API_KEY }}
          FROM_STATION: ${{ secrets.FROM_STATION }}
          TO_STATION: ${{ secrets.TO_STATION }}
          OPERATOR_FILTER: "London Northwest Railway"
        run: python scripts/check_train_delays.py

      - name: Read train status
        id: read-status
        run: |
          if [ -f train_status.txt ]; then
            echo "status=$(cat train_status.txt)" >> $GITHUB_OUTPUT
          else
            echo "status=No train status file found" >> $GITHUB_OUTPUT
          fi

      - name: Send Discord Notification
        if: always() && env.DISCORD_WEBHOOK != ''
        run: |
          STATUS="${{ steps.read-status.outputs.status }}"
          MESSAGE="🚄 **UK Train Alert (CRE→EUS - Jeudi)**\n\n${STATUS}"
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -X POST -H "Content-Type: application/json" \
              -d "{\"content\":\"${MESSAGE}\"}" \
              "$DISCORD_WEBHOOK"
          else
            echo "DISCORD_WEBHOOK not set, skipping notification"
          fi
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
