name: Check UK Train Delays (CRE-EUS - London Northwest Railway - Jeudis)

on:
  schedule:
    # Vérifie les jeudis à 7h, 8h, 9h, 12h, 16h, 18h (6 requêtes/jour - compatible avec le plan gratuit)
    - cron: '0 7 * * 4'
    - cron: '0 8 * * 4'
    - cron: '0 9 * * 4'
    - cron: '0 12 * * 4'
    - cron: '0 16 * * 4'
    - cron: '0 18 * * 4'
  workflow_dispatch:
    # Permet de lancer manuellement

jobs:
  check-delays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run train delay check
        env:
          TRANSPORT_API_ID: ${{ secrets.TRANSPORT_API_ID }}
          TRANSPORT_API_KEY: ${{ secrets.TRANSPORT_API_KEY }}
          FROM_STATION: ${{ secrets.FROM_STATION }}
          TO_STATION: ${{ secrets.TO_STATION }}
          OPERATOR_FILTER: "London Northwest Railway"
        run: python scripts/check_train_delays.py
